name: Build SMSPING EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyserial pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name SMSPING smsping_usb.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSPING-exe
          path: dist/SMSPING.exe
